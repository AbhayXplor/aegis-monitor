syntax = "proto3";

package aegis.telemetry.v1;

// Ultra-low-bandwidth distress beacon.
// Hard cap: the SEALED envelope (header + IV + tag + ciphertext) must be < 100 bytes
// (MAX_PACKET_BYTES in src/proto.mjs). The protobuf payload is typically ~30 bytes and
// the envelope adds 35, so a sealed beacon is ~65 bytes.
//
// Two encodings of this one message are accepted: protobuf (below) and CBOR, a definite
// map keyed by the same field numbers. The decoder tells them apart by the first byte
// (CBOR map 0xA0-0xBF vs. the protobuf device_id tag 0x08).

message DistressBeacon {
  uint32 device_id    = 1;  // rotating hardware id, 0x4B21 style
  uint32 timestamp    = 2;  // unix seconds, replay window ±300 s
  sint32 lat          = 3;  // microdegrees
  sint32 lon          = 4;  // microdegrees
  sint32 altitude_m   = 5;  // metres above ellipsoid, signed
  SosCode sos_code    = 6;
  uint32 heart_rate   = 7;  // bpm, 0 = unknown
  uint32 spo2         = 8;  // percent, 0 = unknown
  uint32 battery_pct  = 9;  // 0-100
  bool  duress_flag   = 10; // covert mode; suppresses detail in downlink
  bytes ext           = 11; // forward-compat padding; capped by the 100 B limit

  enum SosCode {
    UNSPECIFIED   = 0;
    MEDICAL       = 1;
    TRAUMA        = 2;
    HOSTILE       = 3;
    EVACUATION    = 4;
    WATER         = 5;
    CHILDBIRTH    = 6;
    CANCEL        = 7;  // false alarm: closes an unassigned, non-covert incident; otherwise a request
  }
}

// Envelope v2 (not protobuf):
//   [version:1 = 2][device_id:4 BE][epoch:2 BE][iv:12][gcm_tag:16][ciphertext:n]
// AES-256-GCM with the 7-byte header bound as AAD, so a device cannot claim another
// device's id. Key = HKDF-SHA256(master, salt=device_id, info="aegis/v2/epoch/<epoch>"),
// epoch = floor(timestamp / AEGIS_KEY_EPOCH_S) (default one day): per-device, rotating.
// The GCM tag is the signature check.
